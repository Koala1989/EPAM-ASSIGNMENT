components:
  schemas:
    BulkRequest:
      type: object
      description: Parameters for selecting items for bulk operations.
      properties:
        items:
          type: array
          items:
            type: integer
          title: A list of primary key values
        filters:
          type: object
          additionalProperties: {}
          title: A dictionary of filter values
    Category:
      type: object
      description: Serializer for PartCategory.
      properties:
        pk:
          type: integer
          readOnly: true
          title: ID
        name:
          type: string
          description: Name
          maxLength: 100
        description:
          type: string
          description: Description (optional)
          maxLength: 250
        default_location:
          type: integer
          nullable: true
          description: Default location for parts in this category
        default_keywords:
          type: string
          nullable: true
          description: Default keywords for parts in this category
          maxLength: 250
        level:
          type: integer
          readOnly: true
        parent:
          type: integer
          nullable: true
          title: Parent Category
          description: Parent part category
        part_count:
          type: integer
          readOnly: true
          nullable: true
          title: Parts
        subcategories:
          type: integer
          readOnly: true
          nullable: true
        pathstring:
          type: string
          readOnly: true
          title: Path
          description: Path
        starred:
          type: boolean
          description: Return True if the category is directly "starred" by the current user.
          readOnly: true
        structural:
          type: boolean
          description: Parts may not be directly assigned to a structural category, but may be assigned to child categories.
        icon:
          type: string
          nullable: true
          description: Icon (optional)
          maxLength: 100
        parent_default_location:
          type: integer
          readOnly: true
          nullable: true
      required:
      - level
      - name
      - pathstring
      - pk
      - starred
    CategoryParameterTemplate:
      type: object
