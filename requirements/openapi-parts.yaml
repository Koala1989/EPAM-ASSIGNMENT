          type: integer
          description: Part Category
        template:
          type: integer
        default_value:
          type: string
          description: Default Parameter Value
          maxLength: 500
      required:
      - category
      - pk
      - template
    CategoryTree:
      type: object
      description: Serializer for PartCategory tree.
      properties:
        pk:
          type: integer
          readOnly: true
          title: ID
        name:
          type: string
          description: Name
          maxLength: 100
        description:
          type: string
          description: Description (optional)
          maxLength: 250
        pathstring:
          type: string
          title: Path
          description: Path
          maxLength: 250
        parent:
          type: integer
          nullable: true
        tree_id:
          type: integer
          readOnly: true
        level:
          type: integer
          readOnly: true
        icon:
          type: string
          description: Icon (optional)
          maxLength: 100
        structural:
          type: boolean
          description: Parts may not be directly assigned to a structural category, but may be assigned to child categories.
        subcategories:
          type: integer
          readOnly: true
      required:
      - level
      - name
      - pk
      - subcategories
      - tree_id
    DataOutput:
      type: object
      description: Serializer for the DataOutput model.
      properties:
        pk:
          type: integer
          readOnly: true
          title: ID
        created:
          type: string
          format: date
          readOnly: true
        user:
          type: integer
          nullable: true
        user_detail:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        total:
          type: integer
          maximum: 2147483647
          minimum: 0
        progress:
          type: integer
          maximum: 2147483647
          minimum: 0
        complete:
