<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" width="1500" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#5B4D3A"/></marker></defs>
<rect width="1500" height="600" fill="#F6F1E7"/>
<text x="30" y="46" font-size="26" font-weight="700" fill="#3B3226">AI-assisted automation workflow</text>
<text x="30" y="74" font-size="15" fill="#6B5D47">Approved manual cases to Playwright + TypeScript specs · UI and API · writers on Sonnet, independent reviewers on Opus</text>
<rect x="20" y="95" width="440" height="405" rx="14" fill="#EDE5D3"/>
<text x="40" y="122" font-size="13" font-weight="700" letter-spacing="1.5" fill="#7A6A4F">1 · APPROVED CASES</text>
<rect x="500" y="95" width="500" height="405" rx="14" fill="#EDE5D3"/>
<text x="520" y="122" font-size="13" font-weight="700" letter-spacing="1.5" fill="#7A6A4F">2 · AI FLOW (/automate-cases, /automate-api-cases)</text>
<rect x="1040" y="95" width="440" height="405" rx="14" fill="#E4E8D9"/>
<text x="1060" y="122" font-size="13" font-weight="700" letter-spacing="1.5" fill="#6C7A4A">3 · HUMAN APPROVAL</text>
<rect data-box="b1" x="45" y="145" width="390" height="150" rx="10" fill="#FBF8F0" stroke="#8A7A5E" stroke-width="2"/>
<text data-in="b1" x="60" y="177" font-size="17" font-weight="700" fill="#3B3226">Approved UI case</text>
<text data-in="b1" x="60" y="203" font-size="14" fill="#3B3226">UI-&lt;Area&gt;-NNN</text>
<text data-in="b1" x="60" y="225" font-size="14" fill="#3B3226">Review: Approved or Changed</text>
<text data-in="b1" x="60" y="247" font-size="14" fill="#3B3226">anything else is skipped</text>
<rect data-box="b2" x="45" y="325" width="390" height="150" rx="10" fill="#FBF8F0" stroke="#8A7A5E" stroke-width="2"/>
<text data-in="b2" x="60" y="357" font-size="17" font-weight="700" fill="#3B3226">Approved API case</text>
<text data-in="b2" x="60" y="383" font-size="14" fill="#3B3226">API-&lt;Area&gt;-NNN</text>
<text data-in="b2" x="60" y="405" font-size="14" fill="#3B3226">Review: Approved or Changed</text>
<text data-in="b2" x="60" y="427" font-size="14" fill="#3B3226">checked against the OpenAPI schema slice</text>
<rect data-box="b3" x="525" y="140" width="450" height="100" rx="10" fill="#E2B08F" stroke="#B5663C" stroke-width="2"/>
<text data-in="b3" x="540" y="170" font-size="17" font-weight="700" fill="#3B3226">Generator · Sonnet 5.5</text>
<text data-in="b3" x="540" y="195" font-size="14" fill="#3B3226">UI: runs the case live in the browser, writes the spec</text>
<text data-in="b3" x="540" y="216" font-size="14" fill="#3B3226">API: writes, runs and stabilises the spec</text>
<rect data-box="b4" x="525" y="262" width="450" height="100" rx="10" fill="#E2B08F" stroke="#B5663C" stroke-width="2"/>
<text data-in="b4" x="540" y="292" font-size="17" font-weight="700" fill="#3B3226">Healer (UI) + checks</text>
<text data-in="b4" x="540" y="317" font-size="14" fill="#3B3226">fixes how a test runs, never what it checks</text>
<text data-in="b4" x="540" y="338" font-size="14" fill="#3B3226">then lint, type check and stability runs</text>
<rect data-box="b5" x="525" y="384" width="450" height="100" rx="10" fill="#E2B08F" stroke="#B5663C" stroke-width="2"/>
<text data-in="b5" x="540" y="414" font-size="17" font-weight="700" fill="#3B3226">Reviewer · Opus 5.5</text>
<text data-in="b5" x="540" y="439" font-size="14" fill="#3B3226">independent: gets the spec path only</text>
<text data-in="b5" x="540" y="460" font-size="14" fill="#3B3226">conventions, every step asserted, verdict</text>
<line x1="750" y1="242" x2="750" y2="258" stroke="#5B4D3A" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
<line x1="750" y1="364" x2="750" y2="380" stroke="#5B4D3A" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
<rect data-box="b6" x="1065" y="145" width="390" height="330" rx="10" fill="#F1DDB0" stroke="#A9822F" stroke-width="2"/>
<text data-in="b6" x="1080" y="177" font-size="17" font-weight="700" fill="#3B3226">Human approval</text>
<text data-in="b6" x="1080" y="203" font-size="14" fill="#3B3226">review new page objects and client methods</text>
<text data-in="b6" x="1080" y="225" font-size="14" fill="#3B3226">decide on findings: test.fixme + // FINDING:</text>
<text data-in="b6" x="1080" y="247" font-size="14" fill="#3B3226">act on the review: Blockers and Majors</text>
<text data-in="b6" x="1080" y="269" font-size="14" fill="#3B3226"></text>
<text data-in="b6" x="1080" y="291" font-size="14" fill="#3B3226">Done: lint, types, green runs, verdict</text>
<text data-in="b6" x="1080" y="313" font-size="14" fill="#3B3226"></text>
<text data-in="b6" x="1080" y="335" font-size="14" fill="#3B3226">Done specs join the regression suite</text>
<text data-in="b6" x="1080" y="357" font-size="14" fill="#3B3226">npm test · @smoke</text>
<line x1="440" y1="310" x2="495" y2="310" stroke="#5B4D3A" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
<line x1="1000" y1="310" x2="1035" y2="310" stroke="#5B4D3A" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
<path d="M 1260 502 L 1260 535 L 750 535 L 750 506" stroke="#5B4D3A" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arr)"/>
<text x="840" y="527" font-size="14" fill="#6B5D47">fixes and decisions go back: rerun the skill</text>
<rect x="40" y="560" width="20" height="20" rx="4" fill="#E2B08F" stroke="#B5663C" stroke-width="2"/>
<text x="68" y="576" font-size="14" fill="#3B3226">AI agent</text>
<rect x="190" y="560" width="20" height="20" rx="4" fill="#F1DDB0" stroke="#A9822F" stroke-width="2"/>
<text x="218" y="576" font-size="14" fill="#3B3226">Human step</text>
<rect x="340" y="560" width="20" height="20" rx="4" fill="#FBF8F0" stroke="#8A7A5E" stroke-width="2"/>
<text x="368" y="576" font-size="14" fill="#3B3226">Files and data</text>
</svg>
